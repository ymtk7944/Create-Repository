<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #10141a;
        --ink: #f4efe6;
        --accent: #ffcf4a;
        --free: #8dff9a;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 30%, #23303d 0%, var(--ground) 70%);
      }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      #heading {
        position: absolute; top: 70px; left: 0; width: 100%; text-align: center;
        font-size: 64px; font-weight: 800; letter-spacing: -0.02em;
      }
      #heading span { color: var(--accent); }
      #shelf {
        position: absolute; top: 190px; left: 110px; width: 1080px;
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
      }
      .box {
        height: 190px; border-radius: 14px; padding: 18px;
        display: flex; flex-direction: column; justify-content: space-between;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .box b { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
      .box i { font-style: normal; font-size: 28px; }
      #register {
        position: absolute; top: 250px; right: 100px; width: 620px; height: 420px;
        border-radius: 24px; background: #2a2622; border: 6px solid #4a4038;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      }
      #register small { font-size: 32px; letter-spacing: 0.3em; }
      #total { font-size: 100px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
      #thanks { font-size: 30px; letter-spacing: 0.25em; color: var(--free); opacity: 0; }
      #sign {
        position: absolute; top: 700px; right: 120px; width: 560px; text-align: center;
        font-size: 46px; font-weight: 900; letter-spacing: 0.08em; color: #ffe9d6;
        background: #9b2b25; border-radius: 12px; padding: 18px 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <h1 id="heading" class="clip" data-start="0" data-duration="8" data-track-index="0">
        声・字幕・3D・レンダリング、<span>全部コードで。</span>
      </h1>
      <div id="shelf" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="register" class="clip" data-start="0" data-duration="8" data-track-index="2">
        <small>TOTAL</small>
        <div id="total">$0.00</div>
        <div id="thanks">ALL FREE / OSS</div>
      </div>
      <div id="sign" class="clip" data-start="0" data-duration="8" data-track-index="3">VIDEO STUDIO</div>
    </div>
    <script>
      const items = [
        ["hyperframes", "HTML → MP4", "#e9c46a"], ["remotion", "React → MP4", "#3a86ff"],
        ["GSAP", "motion", "#7cb518"], ["three.js", "3D web", "#22223b"],
        ["blender", "3D / render", "#e76f51"], ["mcp-for-blender", "AI × Blender", "#5a4fcf"],
        ["ComfyUI", "image / video gen", "#7b2cbf"], ["chatterbox", "voice (TTS)", "#c1121f"],
        ["faster-whisper", "subtitles", "#f1f1f1"], ["FFmpeg", "encode / mux", "#2d6a4f"],
        ["yt-dlp", "source fetch", "#d62828"], ["chrome-devtools-mcp", "browser QA", "#f4a261"],
        ["impeccable", "design polish", "#ff8fab"], ["skills", "agent skills", "#457b9d"],
      ];
      const shelf = document.getElementById("shelf");
      for (const [name, role, color] of items) {
        const el = document.createElement("div");
        el.className = "box";
        el.style.background = color;
        el.style.color = ["#e9c46a", "#f1f1f1", "#f4a261", "#ff8fab", "#7cb518"].includes(color) ? "#1b1b1b" : "#fff";
        el.innerHTML = `<b>${name}</b><i>${role}</i>`;
        shelf.appendChild(el);
      }

      // Fake "retail" prices that sum up while the boxes drop in, then wipe to $0.00.
      const price = { v: 0 };
      const fmt = (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const total = document.getElementById("total");

      const tl = gsap.timeline({ paused: true });
      tl.from(".box", { y: -260, opacity: 0, rotation: (i) => [-9, 6, -4, 11, -7, 3, 8, -11, 5, -3, 10, -6, 4, -8][i], duration: 0.55, ease: "back.out(1.6)", stagger: 0.16 }, 0.3);
      tl.to(price, { v: 6420.24, duration: 14 * 0.16 + 0.4, ease: "none", onUpdate: () => (total.textContent = fmt(price.v)) }, 0.3);
      tl.to(price, { v: 0, duration: 1.1, ease: "power4.inOut", onUpdate: () => (total.textContent = fmt(price.v)) }, 4.2);
      tl.to("#total", { color: "#8dff9a", scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, 5.3);
      tl.to("#thanks", { opacity: 1, duration: 0.4 }, 5.4);
      tl.to(".box", { y: -8, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.03, ease: "sine.inOut" }, 5.5);
      tl.set({}, {}, 8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
