<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 15mm 12mm; }
  body { font-family: "Noto Sans JP", sans-serif; font-size: 9pt; color: #000; }
  h1 { text-align: center; font-size: 14pt; margin: 0 0 6mm; letter-spacing: .2em; }
  .meta { width: 100%; border-collapse: collapse; margin-bottom: 4mm; }
  .meta td { border: 1px solid #000; padding: 1.5mm 2mm; }
  .meta .h { background: #eee; width: 22mm; }
  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger th, table.ledger td { border: 1px solid #000; padding: 1.2mm 2mm; }
  table.ledger th { background: #eee; font-weight: normal; }
  .num { text-align: right; white-space: nowrap; }
  .total td { font-weight: bold; background: #f5f5f5; }
</style>
</head>
<body>
  <h1>現金出納帳</h1>
  <table class="meta">
    <tr><td class="h">本人氏名</td><td><?= data.userName ?></td><td class="h">作成者氏名</td><td><?= data.author ?></td></tr>
    <tr><td class="h">報告期間</td><td colspan="3"><?= data.period ?></td></tr>
  </table>
  <table class="ledger">
    <thead>
      <tr><th style="width:20mm">年月日</th><th>摘要</th><th style="width:20mm">項目</th>
          <th style="width:22mm">収入</th><th style="width:22mm">支出</th><th style="width:24mm">現金残高</th></tr>
    </thead>
    <tbody>
      <? var prev = null; for (var i = 0; i < data.entries.length; i++) { var e = data.entries[i]; ?>
      <tr>
        <td><?= e.date === prev ? '' : e.date.replace(/-/g, '/') ?></td>
        <td><?= e.memo ?></td>
        <td><?= e.category ?></td>
        <td class="num"><?= e.income ? '¥' + Number(e.income).toLocaleString() : '' ?></td>
        <td class="num"><?= e.expense ? '¥' + Number(e.expense).toLocaleString() : '' ?></td>
        <td class="num"><?= '¥' + Number(e.balance).toLocaleString() ?></td>
      </tr>
      <? prev = e.date; } ?>
      <tr class="total">
        <td colspan="3">期間合計</td>
        <td class="num"><?= '¥' + Number(data.totals.income).toLocaleString() ?></td>
        <td class="num"><?= '¥' + Number(data.totals.expense).toLocaleString() ?></td>
        <td></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
